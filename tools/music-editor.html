<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>唱片整理台 · Inwt</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/music/editor.css?v=__EDITOR_ASSET_VERSION__"><script src="/assets/music/editor.js?v=__EDITOR_ASSET_VERSION__" defer></script></head>
<body><header><a href="/music/" target="_blank" rel="noopener">← 预览留声室</a><span>LOCAL / 唱片整理台</span></header>
<section class="unlock" id="unlock"><p class="kicker">YOUR PRIVATE LINER NOTES</p><h1>把一段余音，放进唱片柜。</h1><p>输入本地服务终端显示的配对码，开始整理。</p><form id="unlock-form"><label for="pin">配对码</label><div class="unlock-row"><input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" required pattern="[0-9]{4}"><button>打开整理台</button></div></form><p id="unlock-status" role="status"></p></section>
<main id="editor" hidden><aside class="library"><div class="library-top"><h1>唱片柜</h1><button id="new-track" type="button">＋ 新增</button></div><label for="search">查找唱片</label><input id="search" type="search" placeholder="曲名、歌手或专辑"><div id="library-list"></div></aside>
<form id="track-form" class="edit-form"><p class="kicker">ADD A RECORD / 留下听后记</p><h2 id="form-title">一张新的唱片</h2>
<label for="share">网易云歌曲链接 / 分享文字</label><div class="lookup-row"><input id="share" type="text" placeholder="粘贴歌曲链接，自动识别" maxlength="4000"><button id="recognize" type="button">识别歌曲</button></div><p id="lookup-status" role="status">支持完整歌曲链接、手机分享文字和网易云短链接。</p>
<div class="field-grid"><div><label for="title">曲名 / 作品标题 *</label><input id="title" required maxlength="300"></div><div><label for="artist">歌手 / 演奏者</label><input id="artist" maxlength="500"></div><div><label for="album">专辑</label><input id="album" maxlength="500"></div><div><label for="room">听音室</label><select id="room"><option value="classical">古典 · 余音厅</option><option value="chinese">华语 · 旧时光</option><option value="western">欧美 · 午夜唱片店</option><option value="japanese">日本 · 深夜电波</option></select></div><div><label for="tags">标签（逗号分隔）</label><input id="tags" placeholder="室内乐, 夜晚, 反复听"></div><div><label for="date">聆听日期</label><input id="date" type="date"></div></div>
<label for="note">听后记</label><textarea id="note" rows="9" maxlength="12000" placeholder="写下为什么收藏它，或者听到它时想起的事情。"></textarea>
<label for="excerpt">歌曲摘录</label><textarea id="excerpt" rows="4" maxlength="600" placeholder="摘一小段喜欢的词句；会在听音室独立展示，不与听后记混在一起。"></textarea>
<details><summary>作品、版本与封面</summary><div class="field-grid"><div><label for="composer">作曲家 / P 主</label><input id="composer" maxlength="300"></div><div><label for="work">作品编号 / 关联作品</label><input id="work" maxlength="300"></div><div><label for="performers">指挥、乐团与演奏版本</label><input id="performers" maxlength="500"></div><div><label for="duration">时长（秒）</label><input id="duration" type="number" min="0" max="86400" step="1" value="0"></div></div><label for="cover">网易云封面地址</label><input id="cover" type="url" placeholder="识别后自动填写"></details>
<label class="check"><input type="checkbox" id="featured">设为这个听音室的精选唱片</label><div class="save-actions"><button type="submit" id="save">保存并更新预览</button><button type="button" id="delete" class="danger" hidden>删除这张唱片</button></div><p id="save-status" role="status">保存到本地文件，发布网站后访客可见。</p></form>
<aside class="live-preview"><p class="kicker">唱片内页 / 实时预览</p><div class="preview-cover"><img id="preview-cover" alt="专辑封面" hidden><span id="preview-placeholder">INWT<br>RECORDS</span></div><h2 id="preview-title">一张新的唱片</h2><p id="preview-credits"></p><p id="preview-note">你的听后记，会留在唱片的 B 面。</p><p class="preview-label">歌曲摘录</p><blockquote id="preview-excerpt">在这里留下一小段喜欢的词句。</blockquote><a id="room-preview" href="/music/classical/" target="_blank" rel="noopener">查看听音室 ↗</a></aside></main></body></html>
