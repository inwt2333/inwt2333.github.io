<meta property="og:title" content="深夜食堂 · Inwt">
<meta property="og:description" content="把吃过的美味，留在这盏灯下。">

<body>
<a class="home" href="index.html" aria-label="返回小站">← <span>返回小站</span></a>
<main>
<section class="scene" aria-label="深夜食堂">
<picture class="room"><source media="(max-width: 600px)" srcset="assets/food/mobile.webp"><img src="assets/food/desktop.webp" width="1672" height="941" alt="暖灯照亮木质吧台，窗外是蓝色雨夜，墙上留着一块照片板。" fetchpriority="high"></picture>
<div class="board" id="board" aria-label="最近的美食记忆"><p class="board-message" role="status">正在翻找美味记忆…</p></div>
<div class="board-controls" id="board-controls" hidden><button id="board-prev" aria-label="上一组食味照片">‹</button><span id="board-page" aria-live="polite"></span><button id="board-next" aria-label="下一组食味照片">›</button></div>
<button class="fortune-jar" id="draw-open" aria-haspopup="dialog" disabled><span class="sticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="jar-body"><strong>食 味 签</strong><small>今天吃什么？</small></span><span class="jar-hint">抽 一 签 ↗</span></button>
<div class="nameplate"><span class="open-mark">今 夜 营 业</span><h1>深夜食堂</h1><p>把日子，吃得有滋有味。</p></div>
<button class="menu-book" id="menu-open" aria-haspopup="dialog"><span class="book-border"><span class="book-small">INWT'S DINER</span><strong>食 味 簿</strong><span class="book-rule"></span><span id="menu-count">一餐一记 · 慢慢收藏</span><span class="book-action">翻 开 看 看 ↗</span></span></button>
<p class="scene-caption">灯亮着，总有一顿值得记住。</p>
</section>
</main>
<dialog id="menu-dialog" class="paper-dialog menu-dialog" aria-labelledby="menu-title"><div class="paper-content"><button class="close" data-close aria-label="关闭菜单">×</button><p class="eyebrow">A TASTE OF EVERYDAY</p><h2 id="menu-title">食味簿</h2><p class="muted">一日一页，收好每次相逢的滋味。</p><div id="archive"></div></div></dialog>
<dialog id="receipt-dialog" class="paper-dialog receipt-dialog" aria-labelledby="receipt-title"><div class="paper-content"><button class="close" data-close aria-label="关闭小票">×</button><p class="eyebrow">INWT'S DINER · 用餐留念</p><h2 id="receipt-title">深夜食堂</h2><div class="receipt-meta"><time id="receipt-date"></time><span id="receipt-total"></span></div><h3 id="meal-title" hidden></h3><p id="meal-note" hidden></p><div id="receipt-photos"></div><footer class="receipt-footer">谢谢款待，下次再来。<span>GOOD FOOD, GOOD DAYS.</span><i class="barcode" aria-hidden="true"></i></footer></div></dialog>
<dialog id="fortune-dialog" class="paper-dialog fortune-dialog" aria-labelledby="fortune-title"><div class="paper-content"><button class="close" data-close aria-label="关闭食味签">×</button><p class="eyebrow">LET YOUR APPETITE WANDER</p><h2 id="fortune-title">今夜，吃这一味</h2><p id="draw-status" class="muted" role="status" aria-live="polite"></p><div id="fortune-result" hidden></div><div class="fortune-actions"><button id="draw-again">再抽一签</button><button id="draw-receipt" disabled>翻看这顿的小票 ↗</button></div><p class="muted fortune-footnote">从吃过的美味里抽一签，一轮抽完前不重复。</p></div></dialog>
<dialog id="viewer" aria-label="美食照片查看"><button class="viewer-close" data-close aria-label="关闭照片">×</button><button class="prev" id="previous" aria-label="上一张">‹</button><figure><img id="full-photo" alt=""><figcaption id="photo-caption" aria-live="polite"></figcaption></figure><button class="next" id="next" aria-label="下一张">›</button></dialog>
<noscript><p class="no-script">请启用 JavaScript 浏览美食照片与用餐记录。</p></noscript>

</html>
