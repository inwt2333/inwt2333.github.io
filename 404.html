<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · 此处无站 · Inwt</title>
    <meta name="description" content="本次列车不停靠此站。">
    <meta name="robots" content="noindex">

    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <style>
        :root {
            --bg: #0a0a0c;
            --ink: #f5f5f7;
            --soft: #9a9aa0;
            --grid: rgba(255, 255, 255, 0.045);
            --red: #ff5a4f;
            --cyan: #42f5e9;
            --yellow: #ffd60a;
            --green: #30d158;
            --mono: 'Space Mono', ui-monospace, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            background-image: radial-gradient(var(--grid) 1px, transparent 1px);
            background-size: 26px 26px;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .panel {
            text-align: center;
            padding: 0 28px;
            max-width: 640px;
        }

        .eyebrow {
            font-family: var(--mono);
            font-size: 0.68rem;
            letter-spacing: 0.5em;
            color: var(--soft);
            margin-bottom: 34px;
            animation: rise 0.8s ease 0.1s both;
        }

        /* 断裂的轨道：线路行至此处戛然而止 */
        .roundel { animation: rise 0.8s ease 0.25s both; }

        .code {
            font-family: var(--mono);
            font-size: clamp(3.6rem, 12vw, 5.6rem);
            font-weight: 700;
            letter-spacing: 0.14em;
            margin: 30px 0 14px;
            animation: rise 0.8s ease 0.4s both;
        }

        .code span { color: var(--red); }

        h1 {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 700;
            letter-spacing: 0.12em;
            margin-bottom: 16px;
            animation: rise 0.8s ease 0.55s both;
        }

        p.desc {
            color: var(--soft);
            font-size: 0.92rem;
            line-height: 2;
            margin-bottom: 40px;
            animation: rise 0.8s ease 0.7s both;
        }

        .links {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            animation: rise 0.8s ease 0.85s both;
        }

        .links a {
            color: var(--ink);
            text-decoration: none;
            font-size: 0.86rem;
            font-weight: 500;
            padding: 11px 26px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            transition: border-color 0.25s, background 0.25s, transform 0.25s;
        }

        .links a:hover { border-color: var(--ink); background: rgba(255, 255, 255, 0.07); transform: translateY(-2px); }
        .links a.primary { border-color: var(--green); }
        .links a.primary:hover { background: rgba(48, 209, 88, 0.1); border-color: var(--green); }

        footer {
            position: fixed;
            bottom: 26px;
            left: 0; right: 0;
            text-align: center;
            font-family: var(--mono);
            font-size: 0.66rem;
            letter-spacing: 0.24em;
            color: var(--soft);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; }
        }
    </style>
</head>
<body>

    <main class="panel">
        <div class="eyebrow">INWT RAILWAY · 线路通告</div>

        <svg class="roundel" width="220" height="64" viewBox="0 0 220 64" aria-hidden="true">
            <path d="M 0 32 H 74" stroke="#ff5a4f" stroke-width="7" stroke-linecap="round"/>
            <circle cx="110" cy="32" r="15" style="fill: var(--bg)" stroke="#ff5a4f" stroke-width="5"/>
            <circle cx="110" cy="32" r="6" style="fill: var(--ink)"/>
            <path d="M 146 32 H 220" stroke="#ff5a4f" stroke-width="7" stroke-linecap="round" opacity="0.2"/>
            <path d="M 146 32 H 178" stroke="#ff5a4f" stroke-width="7" stroke-linecap="round"/>
        </svg>

        <div class="code">4<span>0</span>4</div>
        <h1>本次列车不停靠此站</h1>
        <p class="desc">你要找的站台不存在，或者已经改线。<br>车门已关闭，请随列车返回门厅换乘。</p>

        <nav class="links" aria-label="换乘线路">
            <a class="primary" href="index.html">返回门厅</a>
            <a href="essays.html">随笔线</a>
            <a href="gallery.html">光影线</a>
        </nav>
    </main>

    <footer>© INWT · EST. 2024</footer>

</body>
</html>
