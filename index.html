    <style>
        :root {
            --bg: #0a0a0c;
            --ink: #f5f5f7;
            --soft: #9a9aa0;
            --grid: rgba(255, 255, 255, 0.045);
            --glow: rgba(122, 162, 255, 0.075);
            --blend: screen;
            --panel: rgba(12, 12, 16, 0.55);
            --panel-line: rgba(255, 255, 255, 0.1);
            --red: #ff5a4f;
            --cyan: #42f5e9;
            --yellow: #ffd60a;
            --green: #30d158;
            --mono: 'Space Mono', ui-monospace, monospace;
        }

        /* 白天到站：换成纸面的浅色轨道（默认跟随系统；data-theme 为右上角按钮的手动选择） */
        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                --bg: #f2f2f5;
                --ink: #1c1c22;
                --soft: #6b6b74;
                --grid: rgba(0, 0, 0, 0.06);
                --glow: rgba(80, 112, 235, 0.1);
                --blend: multiply;
                --panel: rgba(255, 255, 255, 0.62);
                --panel-line: rgba(0, 0, 0, 0.1);
                --red: #e03e33;
                --cyan: #00a89b;
                --yellow: #c79700;
                --green: #1f9d52;
            }
        }

        :root[data-theme="light"] {
            --bg: #f2f2f5;
            --ink: #1c1c22;
            --soft: #6b6b74;
            --grid: rgba(0, 0, 0, 0.06);
            --glow: rgba(80, 112, 235, 0.1);
            --blend: multiply;
            --panel: rgba(255, 255, 255, 0.62);
            --panel-line: rgba(0, 0, 0, 0.1);
            --red: #e03e33;
            --cyan: #00a89b;
            --yellow: #c79700;
            --green: #1f9d52;
        }

        /* 线路与圆环改由变量驱动（CSS 覆盖标记里的固定描边），昼夜换肤时同步加深 */
        #line-green { stroke: var(--green); }
        #line-red { stroke: var(--red); }
        #line-yellow { stroke: var(--yellow); }
        #line-cyan { stroke: var(--cyan); }
        .st-green .ring { stroke: var(--green); }
        .st-red .ring { stroke: var(--red); }
        .st-yellow .ring { stroke: var(--yellow); }
        .st-cyan .ring { stroke: var(--cyan); }
        .decor [data-line="green"] circle { stroke: var(--green); }
        .decor [data-line="red"] circle { stroke: var(--red); }
        .decor [data-line="yellow"] circle { stroke: var(--yellow); }
        .decor [data-line="cyan"] circle { stroke: var(--cyan); }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            background-image: radial-gradient(var(--grid) 1px, transparent 1px);
            background-size: 26px 26px;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .map {
            position: fixed;
            inset: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            display: block;
        }

        /* ---------- 线路（入场时自绘生长） ---------- */
        .line, .halo {
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
        }

        .line {
            stroke-width: 9;
            opacity: 0.92;
            animation: draw 2.1s cubic-bezier(0.55, 0, 0.2, 1) var(--d, 0s) forwards;
            transition: stroke-width 0.3s, opacity 0.3s;
        }

        .halo {
            stroke-width: 30;
            opacity: 0;
            animation: draw 2.1s cubic-bezier(0.55, 0, 0.2, 1) var(--d, 0s) forwards,
                       haloIn 0.9s ease var(--d, 0s) forwards;
        }

        .line:hover { stroke-width: 11.5; opacity: 1; }

        /* 线路交叉处的「过线」桥接：底层线路留出缺口 */
        .bridge { fill: var(--bg); }

        @keyframes draw { to { stroke-dashoffset: 0; } }
        @keyframes haloIn { to { opacity: 0.07; } }

        /* 二次到访：跳过生长动画 */
        .revisit .line { animation: none; stroke-dashoffset: 0; }
        .revisit .halo { animation: none; stroke-dashoffset: 0; opacity: 0.07; }
        .revisit .station, .revisit .masthead > *, .revisit .footer-hint,
        .revisit .legend, .revisit .theme-toggle { animation: none; opacity: 1; transform: none; }

        /* ---------- 悬停联动：聚焦所在线路，其余压暗（~= 兼容换乘站多线） ---------- */
        .map[data-focus] .line { opacity: 0.13; }
        .map[data-focus] .station { filter: brightness(0.55) saturate(0.5); }
        .map[data-focus] .decor [data-line] { filter: brightness(0.6) saturate(0.45); }
        .map[data-focus~="green"]  .line[data-line="green"],
        .map[data-focus~="red"]    .line[data-line="red"],
        .map[data-focus~="yellow"] .line[data-line="yellow"],
        .map[data-focus~="cyan"]   .line[data-line="cyan"] { opacity: 1; }
        .map[data-focus~="green"]  .station[data-line~="green"],
        .map[data-focus~="red"]    .station[data-line~="red"],
        .map[data-focus~="yellow"] .station[data-line~="yellow"],
        .map[data-focus~="cyan"]   .station[data-line~="cyan"] { filter: none; }
        .map[data-focus~="green"]  .decor [data-line~="green"],
        .map[data-focus~="red"]    .decor [data-line~="red"],
        .map[data-focus~="yellow"] .decor [data-line~="yellow"],
        .map[data-focus~="cyan"]   .decor [data-line~="cyan"] { filter: none; }

        /* ---------- 站点 ---------- */
        .station {
            cursor: pointer;
            outline: none;
            opacity: 0;
            transform: scale(0.4);
            transform-box: fill-box;
            transform-origin: center;
            animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) var(--d, 2s) forwards;
            transition: filter 0.25s;
        }

        @keyframes pop { to { opacity: 1; transform: none; } }

        .station .hit { fill: transparent; }
        .station .ring { fill: var(--bg); stroke-width: 5; transition: stroke-width 0.2s; }
        .station .core { fill: var(--ink); transition: r 0.2s; }
        .station .st-name { fill: var(--ink); font-weight: 700; font-size: 27px; font-family: 'Noto Sans SC', sans-serif; }
        .station .st-sub { fill: var(--soft); font-weight: 400; font-size: 14px; font-family: var(--mono); letter-spacing: 0.04em; transition: fill 0.2s; }
        .station:hover .ring, .station:focus .ring { stroke-width: 7; }
        .station:hover .core, .station:focus .core { r: 11; }
        .station:hover .st-sub { fill: var(--ink); }

        .decor {
            opacity: 0;
            animation: decorIn 0.6s ease var(--d, 2.4s) forwards;
        }

        .decor [data-line] { transition: filter 0.25s; }

        @keyframes decorIn { to { opacity: 1; } }

        .decor circle { fill: var(--bg); stroke-width: 3; }
        .decor text { fill: var(--soft); font-size: 15px; font-weight: 500; font-family: 'Noto Sans SC', sans-serif; }

        /* ---------- 标题区 ---------- */
        .masthead {
            position: fixed;
            top: 34px;
            left: 40px;
            z-index: 5;
            pointer-events: none;
        }

        .masthead .eyebrow {
            font-family: var(--mono);
            font-size: 0.68rem;
            letter-spacing: 0.5em;
            color: var(--soft);
            margin-bottom: 10px;
            opacity: 0;
            animation: riseIn 0.8s ease 0.3s forwards;
        }

        .masthead h1 {
            font-size: clamp(1.7rem, 4vw, 2.4rem);
            font-weight: 900;
            letter-spacing: 0.22em;
            opacity: 0;
            animation: riseIn 0.8s ease 0.5s forwards;
        }

        .masthead .status {
            margin-top: 12px;
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--soft);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            animation: riseIn 0.8s ease 0.7s forwards;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        .status .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* ---------- 线路图例 ---------- */
        .legend {
            position: fixed;
            right: 40px;
            bottom: 70px;
            z-index: 5;
            padding: 13px 18px 14px;
            background: var(--panel);
            border: 1px solid var(--panel-line);
            border-radius: 14px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            font-size: 0.78rem;
            opacity: 0;
            animation: riseIn 0.8s ease 1.6s forwards;
        }

        .legend-head {
            font-family: var(--mono);
            font-size: 0.62rem;
            letter-spacing: 0.32em;
            color: var(--soft);
            margin-bottom: 9px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 3.5px 0;
            cursor: default;
        }

        .legend-row i {
            flex: none;
            width: 16px; height: 5px;
            border-radius: 3px;
            background: var(--c, var(--soft));
        }

        .legend-row span { color: var(--soft); font-family: var(--mono); font-size: 0.68rem; margin-left: 4px; }

        /* ---------- 昼夜换乘按钮 ---------- */
        .theme-toggle {
            position: fixed;
            top: 34px;
            right: 40px;
            z-index: 6;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--panel-line);
            background: var(--panel);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: var(--soft);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.25s, border-color 0.25s;
            opacity: 0;
            animation: riseIn 0.8s ease 1.0s forwards;
        }

        .theme-toggle:hover { color: var(--ink); border-color: var(--soft); }
        .theme-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

        /* 图标随生效主题切换：夜间显示太阳（点击到白天），白天显示月亮 */
        .theme-toggle .icon-moon { display: none; }
        :root[data-theme="light"] .theme-toggle .icon-sun { display: none; }
        :root[data-theme="light"] .theme-toggle .icon-moon { display: block; }
        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) .theme-toggle .icon-sun { display: none; }
            :root:not([data-theme="dark"]) .theme-toggle .icon-moon { display: block; }
        }

        /* ---------- 鼠标辉光 ---------- */
        .cursor-glow {
            position: fixed;
            width: 560px;
            height: 560px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow), transparent 62%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            left: -999px;
            mix-blend-mode: var(--blend);
            z-index: 4;
            opacity: 0;
            transition: opacity 0.4s;
        }

        /* ---------- 底部提示 ---------- */
        .footer-hint {
            position: fixed;
            bottom: 26px;
            left: 0; right: 0;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            font-family: var(--mono);
            font-size: 0.68rem;
            letter-spacing: 0.2em;
            color: var(--soft);
            pointer-events: none;
            opacity: 0;
            animation: riseIn 0.8s ease 1.2s forwards;
        }

        .footer-hint .enter { display: flex; align-items: center; gap: 8px; }

        .footer-hint a {
            pointer-events: auto;
            color: var(--soft);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: color 0.25s, border-color 0.25s;
        }

        .footer-hint a:hover { color: var(--ink); border-color: var(--ink); }

        @media (max-width: 900px) {
            .legend { display: none; } /* 竖屏裁切下图例易出屏，隐藏保持地图清爽 */
        }

        @media (max-width: 700px) {
            .masthead { top: 24px; left: 24px; }
            .theme-toggle { top: 20px; right: 20px; width: 38px; height: 38px; }
            .footer-hint { padding: 0 24px; }
            .station .st-name { font-size: 31px; }
            .station .st-sub { font-size: 16px; }
            .decor { display: none; } /* 竖屏裁切下装饰站易出屏，隐藏保持地图清爽 */
            .cursor-glow { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .line, .halo { animation: none; stroke-dashoffset: 0; }
            .halo { opacity: 0.07; }
            .station, .decor { animation: none; opacity: 1; transform: none; }
            .masthead > *, .footer-hint, .legend, .theme-toggle { animation: none; opacity: 1; transform: none; }
            .train { display: none; }
            .status .dot { animation: none; }
        }
    </style>
    <script>/* 昼夜记忆：渲染前恢复上次的手动选择，避免闪屏 */
    try { var _t = localStorage.getItem('theme'); if (_t) document.documentElement.dataset.theme = _t; } catch (e) {}</script>

        <a class="station" data-line="red cyan yellow" href="about.html" aria-label="关于本站" style="--d: 2.5s">
            <circle class="hit" cx="520" cy="620" r="40"/>
            <circle class="ring" cx="520" cy="620" r="15" style="stroke: var(--ink)"/>
            <circle class="core" cx="520" cy="620" r="8"/>
            <text class="st-name" x="520" y="586" text-anchor="middle">关于</text>
            <text class="st-sub" x="520" y="664" text-anchor="middle">站长与线路</text>
        </a>

        <!-- 列车：线成之后发车 -->
        <g id="trains"></g>
    </svg>

    <header class="masthead">
        <div class="eyebrow">INWT RAILWAY</div>
        <h1>Inwt · 小站</h1>
        <div class="status"><span class="dot" aria-hidden="true"></span>线路正常运行</div>
    </header>

    <aside class="legend" aria-label="线路图例">
        <div class="legend-head">LINES · 线路</div>
        <div class="legend-row" data-line="red"><i style="--c: var(--red)" aria-hidden="true"></i>随笔线<span>ESSAYS</span></div>
        <div class="legend-row" data-line="cyan"><i style="--c: var(--cyan)" aria-hidden="true"></i>光影线<span>GALLERY</span></div>
        <div class="legend-row" data-line="yellow"><i style="--c: var(--yellow)" aria-hidden="true"></i>乐律线<span>CLASSIC</span></div>
        <div class="legend-row" data-line="green"><i style="--c: var(--green)" aria-hidden="true"></i>学园线<span>AI·LEARN</span></div>
    </aside>

    <footer class="footer-hint">
        <span>© INWT</span>
        <span>EST. 2024</span>
    </footer>

    <script>
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const revisit = !!sessionStorage.getItem('visited');
        sessionStorage.setItem('visited', '1');
        if (revisit) document.body.classList.add('revisit');

        /* ---------- 由航点生成「直线 + 圆角转弯」路径 ---------- */
        function roundedPath(pts, r = 30) {
            let d = `M ${pts[0][0]} ${pts[0][1]}`;
            for (let i = 1; i < pts.length - 1; i++) {
                const [px, py] = pts[i - 1], [cx, cy] = pts[i], [nx, ny] = pts[i + 1];
                const v1 = [cx - px, cy - py], v2 = [nx - cx, ny - cy];
                const l1 = Math.hypot(v1[0], v1[1]), l2 = Math.hypot(v2[0], v2[1]);
                const rr = Math.min(r, l1 / 2, l2 / 2);
                d += ` L ${cx - v1[0] / l1 * rr} ${cy - v1[1] / l1 * rr}`;
                d += ` Q ${cx} ${cy} ${cx + v2[0] / l2 * rr} ${cy + v2[1] / l2 * rr}`;
            }
            const last = pts[pts.length - 1];
            d += ` L ${last[0]} ${last[1]}`;
            return d;
        }

        const ROUTES = {
            'line-green':  [[-100, 170], [1540, 170]],
            'line-red':    [[-100, 800], [340, 800], [560, 580], [560, 310], [620, 250], [1540, 250]],
            'line-yellow': [[940, -60], [940, 480], [800, 620], [-100, 620]],
            'line-cyan':   [[-100, 480], [380, 480], [620, 720], [1540, 720]]
        };
        Object.entries(ROUTES).forEach(([id, pts]) => {
            document.getElementById(id).setAttribute('d', roundedPath(pts));
        });

        /* ---------- 光晕轨道（克隆线路） ---------- */
        const SVGNS = 'http://www.w3.org/2000/svg';
        const svg = document.querySelector('.map');
        const lines = [...document.querySelectorAll('.line')];
        lines.forEach(l => {
            const h = l.cloneNode();
            h.setAttribute('class', 'halo');
            h.removeAttribute('id');
            svg.insertBefore(h, l);
        });

        /* ---------- 交叉处「过线」桥接：底层线路留缺口，上层线路跨越 ---------- */
        // 黄线（垂直 x=940）上跨绿线（y=170）与红线（y=250）：在黄线光晕前插入底色缺口
        const yellow = document.getElementById('line-yellow');
        [[940, 170], [940, 250]].forEach(([x, y]) => {
            const cap = document.createElementNS(SVGNS, 'circle');
            cap.setAttribute('cx', x); cap.setAttribute('cy', y); cap.setAttribute('r', 10);
            cap.setAttribute('class', 'bridge');
            svg.insertBefore(cap, yellow.previousSibling);
        });

        /* ---------- 列车：车头 + 拖尾沿路径自动转向前进 ---------- */
        const TRAINS = [
            { line: 0, color: '#30d158', dur: 19, phases: [0, 9.5] },
            { line: 1, color: '#ff5a4f', dur: 24, phases: [4, 16] },
            { line: 2, color: '#ffd60a', dur: 21, phases: [7] },
            { line: 3, color: '#42f5e9', dur: 17, phases: [3, 11] }
        ];
        const trainsG = document.getElementById('trains');
        const motions = [];

        TRAINS.forEach(t => {
            const d = lines[t.line].getAttribute('d');
            t.phases.forEach(phase => {
                const g = document.createElementNS(SVGNS, 'g');
                g.style.filter = `drop-shadow(0 0 6px ${t.color})`;
                [[0, 4.5, 1], [9, 3, 0.45], [15, 2.5, 0.2]].forEach(([back, r, op]) => {
                    const c = document.createElementNS(SVGNS, 'circle');
                    c.setAttribute('cx', -back);
                    c.setAttribute('r', r);
                    c.style.fill = 'var(--ink)'; /* 昼夜换肤时列车随之变色 */
                    c.setAttribute('opacity', op);
                    g.appendChild(c);
                });
                const m = document.createElementNS(SVGNS, 'animateMotion');
                m.setAttribute('dur', t.dur + 's');
                m.setAttribute('repeatCount', 'indefinite');
                m.setAttribute('rotate', 'auto');
                m.setAttribute('begin', 'indefinite');
                m.setAttribute('path', d);
                g.appendChild(m);
                trainsG.appendChild(g);
                motions.push({ m, phase });
            });
        });

        // 线路画完之后发车（相位错开）；重访时立刻发车
        setTimeout(() => motions.forEach(({ m, phase }) => {
            try { m.beginElementAt(-phase); } catch (e) { try { m.beginElement(); } catch (e2) {} }
        }), reduced || revisit ? 150 : 2800);

        /* ---------- 悬停联动：站点 / 线路 / 图例聚焦所在线路 ---------- */
        const setFocus = line => line
            ? svg.setAttribute('data-focus', line)
            : svg.removeAttribute('data-focus');
        document.querySelectorAll('[data-line]').forEach(el => {
            el.addEventListener('mouseenter', () => setFocus(el.dataset.line));
            el.addEventListener('mouseleave', () => setFocus(null));
        });
        svg.addEventListener('focusin', e => {
            const t = e.target.closest('[data-line]');
            if (t) setFocus(t.dataset.line);
        });
        svg.addEventListener('focusout', () => setTimeout(() => {
            const a = document.activeElement;
            if (!a || !a.closest || !a.closest('[data-line]')) setFocus(null);
        }, 0));

        /* ---------- 昼夜换乘：默认跟随系统，手动选择写入 localStorage ---------- */
        const themeToggle = document.getElementById('theme-toggle');
        const mqLight = matchMedia('(prefers-color-scheme: light)');
        const isLight = () => document.documentElement.dataset.theme === 'light'
            || (mqLight.matches && document.documentElement.dataset.theme !== 'dark');
        themeToggle.addEventListener('click', () => {
            document.documentElement.dataset.theme = isLight() ? 'dark' : 'light';
            try { localStorage.setItem('theme', document.documentElement.dataset.theme); } catch (e) {}
        });

        /* ---------- 鼠标辉光 ---------- */
        const glow = document.getElementById('cursor-glow');
        if (matchMedia('(pointer: fine)').matches && !reduced) {
            addEventListener('mousemove', e => {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
                glow.style.opacity = 1;
            }, { passive: true });
            addEventListener('mouseleave', () => glow.style.opacity = 0);
        }

        /* ---------- 随笔线：最新一篇文章 ---------- */
        fetch('posts.json')
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(list => {
                const latest = list.find(p => p.category === 'essay');
                if (latest) document.getElementById('sub-essays').textContent = '最新 · ' + latest.title;
            })
            .catch(() => {});

        /* ---------- 光影线：照片与足迹统计 ---------- */
        fetch('photos.json')
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(ps => {
                const m = new Set(ps.filter(p => p.lat != null).map(p => p.lat.toFixed(1) + ',' + p.lng.toFixed(1))).size;
                document.getElementById('sub-gallery').textContent = `${ps.length} 张照片 · ${m} 处足迹`;
            })
            .catch(() => {});
    </script>
</body>
</html>
